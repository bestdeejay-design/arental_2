name: Bug report
description: Report a problem with the АТМОСФЕРА site
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I click the theme switcher, the page flashes white…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we see it ourselves?
      placeholder: |
        1. Open index.html
        2. Click the "light" theme button
        3. See the flash
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this in a clean browser profile.
          required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, console errors, device info — anything useful.
    validations:
      required: false
