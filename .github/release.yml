# .github/release.yml — auto-generated release notes
# Labels drive the grouping. Use conventional labels on PRs.
changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "📚 Documentation"
      labels:
        - "docs"
        - "documentation"
    - title: "🎨 Styles & Polish"
      labels:
        - "style"
        - "polish"
    - title: "♻️ Maintenance"
      labels:
        - "chore"
        - "refactor"
        - "dependencies"
